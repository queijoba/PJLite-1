    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- LZ-String for text code compression -->

    <!-- Google Fonts -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'title': ['Cinzel', 'serif'],

    <style>
        body { background-color: #e5e7eb; }
        .print-break { page-break-inside: avoid; }
        
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }
            body { background-color: white !important; }
            .no-print { display: none !important; }
            
            /* Removemos bordas dos inputs em impressão para ficar mais limpo */
            input, textarea { border: none !important; background: transparent !important; resize: none; }
            select { appearance: none; border: none !important; background: transparent !important; }
            
            /* Ajuste de grid para paisagem na impressão */
            .print-landscape-grid {
                display: grid !important;
                grid-template-columns: repeat(12, minmax(0, 1fr)) !important;
            }
        }
        
        /* CSS para o Modelo de Impressão (Tela e Físico) */
        .print-mode-active {
            border: none !important;
            box-shadow: none !important;
            background: white !important;
        }
        .print-mode-active .bg-dragon-dark {
            background-color: transparent !important;
            color: #4b5563 !important;
            border-bottom: 2px solid #9ca3af !important;
            font-weight: 700 !important;
        }
        .print-mode-active h2.bg-dragon-dark {
            border-bottom: 2px solid #9ca3af !important;
            color: #111827 !important;
        }
        .print-mode-active .top-bar-container {
            background-color: #ffffff !important;
            border-bottom: 2px solid #e5e7eb !important;
            color: #374151 !important;
        }
        .print-mode-active .top-bar-title-text { color: #111827 !important; }
        .print-mode-active .top-bar-btn {
            background-color: transparent !important;
            border: 1px solid #d1d5db;
            color: #4b5563 !important;
            box-shadow: none;
        }
        .print-mode-active .bg-gray-200, .print-mode-active .bg-gray-50, .print-mode-active .bg-red-50, .print-mode-active .bg-blue-50 {
            background-color: transparent !important;
        }
        .print-mode-active .sub-header-print {
            border: none !important;
            border-bottom: 1px solid #9ca3af !important;
            color: #4b5563 !important;
            background: transparent !important;
            padding-left: 0 !important;
        }
        .print-mode-active input, .print-mode-active textarea, .print-mode-active select { 
            border-color: #d1d5db !important; 
            border-bottom: 1px solid #9ca3af !important;
        }
        .print-mode-active .hide-in-print-mode { display: none !important; }

        /* --- TEMA CLÁSSICO DRAGONBANE --- */
        body.theme-classic {
            background-color: #dcd4be !important;
        }
        body.theme-classic .max-w-6xl, body.theme-classic .max-w-5xl {
            background-color: #f7f3e8 !important;
            border-color: #4a3b32 !important;
        }
        body.theme-classic .bg-dragon-dark {
            background-color: #1b3b34 !important; /* Verde petróleo clássico */
            color: #f9f6ef !important;
        }
        body.theme-classic .border-dragon-dark {
            border-color: #5c4a3d !important;
        }
        body.theme-classic input, body.theme-classic textarea, body.theme-classic select {
            border-color: #b39f83 !important;
        }
        body.theme-classic .bg-gray-50, body.theme-classic .bg-gray-100 {
            background-color: #f2ece1 !important;
        }

        /* --- TEMA PERSONALIZADO --- */
        body.theme-custom {
            background-size: cover !important;
            background-position: center !important;
            background-attachment: fixed !important;
        }
        
        /* Animações */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</head>

            Skull: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="15" cy="12" r="1"></circle><path d="M8 20v2h8v-2"></path><path d="m12.5 17-.5-1-.5 1h1z"></path><path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20"></path></svg>,
            Dice: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="15.5" r="1.5"></circle><circle cx="8.5" cy="15.5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle></svg>,
            Copy: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
            Code: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        };

        const getSavedCharacters = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } };
        const getSavedThreats = () => { try { return JSON.parse(localStorage.getItem(THREAT_STORAGE_KEY)) || []; } catch { return []; } };

        const getChanceBase = (val) => {
            if (val >= 16) return 7;
            if (val >= 13) return 6;
            if (val >= 9) return 5;
            if (val >= 6) return 4;
            return 3;
        };

        const getDanoBonus = (val) => {
            if (val >= 17) return '+D6';
            if (val >= 13) return '+D4';
            return '-';
        };

        const getMovimento = (ancestralidade, agl) => {
            let base = 10;
            const anc = (ancestralidade || '').toLowerCase();
            if (anc.includes('halfling') || anc.includes('anão') || anc.includes('anao') || anc.includes('marreco')) base = 8;
            else if (anc.includes('lupino')) base = 12;
            let mod = 0;
            if (agl <= 6) mod = -4;
            else if (agl <= 9) mod = -2;
            else if (agl >= 16) mod = 4;
            else if (agl >= 13) mod = 2;
            return base + mod;
        };

        const hexToRgb = (hex) => {
            let cleaned = hex.replace('#', '');
            if (cleaned.length === 3) cleaned = cleaned.split('').map(c => c + c).join('');
            const num = parseInt(cleaned, 16);
            return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        };

        function App() {
            const [view, setView] = useState('dashboard');
            const [savedChars, setSavedChars] = useState(getSavedCharacters());
            const [savedThreats, setSavedThreats] = useState(getSavedThreats());
            const [data, setData] = useState(initialData);
            
            const [theme, setTheme] = useState(() => { try { return localStorage.getItem(THEME_PREF_KEY) || 'default'; } catch { return 'default'; } });
            const [customBgUrl, setCustomBgUrl] = useState(() => { try { return localStorage.getItem(CUSTOM_BG_KEY) || ''; } catch { return ''; } });
            const [customWinColor, setCustomWinColor] = useState(() => { try { return localStorage.getItem(CUSTOM_WIN_COLOR_KEY) || '#ffffff'; } catch { return '#ffffff'; } });
            const [customBarColor, setCustomBarColor] = useState(() => { try { return localStorage.getItem(CUSTOM_BAR_COLOR_KEY) || '#1a1a1a'; } catch { return '#1a1a1a'; } });
            const [customOpacity, setCustomOpacity] = useState(() => { try { return localStorage.getItem(CUSTOM_OPACITY_KEY) || '0.93'; } catch { return '0.93'; } });

            const [showCustomBgModal, setShowCustomBgModal] = useState(false);
            const [showUrlInput, setShowUrlInput] = useState(false);
            const [tempUrl, setTempUrl] = useState('');
            const [mobileTab, setMobileTab] = useState('status');
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            const [toastMsg, setToastMsg] = useState('');
            
            const [showSystemModal, setShowSystemModal] = useState(false);
            const [createTarget, setCreateTarget] = useState(null); 
            
            const [showThreatModal, setShowThreatModal] = useState(false);
            const [showGuideModal, setShowGuideModal] = useState(false);
            const [guideTab, setGuideTab] = useState('import');
            const [isPrintMode, setIsPrintMode] = useState(false);

            // Controle do Modal de Código da Ficha
            const [codeModal, setCodeModal] = useState({ isOpen: false, mode: 'export', code: '' });

            useEffect(() => {
                try { localStorage.setItem(THEME_PREF_KEY, theme); } catch {}
                document.body.className = `font-body text-gray-800 antialiased p-4 md:p-8 ${theme === 'classic' ? 'theme-classic' : theme === 'custom' ? 'theme-custom' : ''}`;
            }, [theme]);

            useEffect(() => {
                if (theme === 'custom' && customBgUrl) document.body.style.backgroundImage = `url(${customBgUrl})`;
                else document.body.style.backgroundImage = '';
            }, [theme, customBgUrl]);

            // Escuta o evento afterprint para sair automaticamente do modo impressão
            useEffect(() => {
                const handleAfterPrint = () => setIsPrintMode(false);
                window.addEventListener('afterprint', handleAfterPrint);
                return () => window.removeEventListener('afterprint', handleAfterPrint);
            }, []);

            const getWindowStyle = () => {
                if (theme !== 'custom') return {};
                const [r, g, b] = hexToRgb(customWinColor);
                return { backgroundColor: `rgba(${r}, ${g}, ${b}, ${customOpacity})`, backdropFilter: 'blur(5px)' };
            };

            const getBarStyle = () => {
                if (theme !== 'custom') return {};
                return { backgroundColor: customBarColor, color: '#ffffff' };
            };

            const saveToLocal = (itemData) => {
                let savingData = JSON.parse(JSON.stringify(itemData));
                if (!savingData.id) savingData.id = Date.now().toString();
                
                const type = savingData.type || 'pc';
                savingData.type = type;

                if (type === 'pc') {
                    let chars = getSavedCharacters();
                    const index = chars.findIndex(c => c.id === savingData.id);
                    if (index >= 0) chars[index] = savingData;
                    else chars.push(savingData);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(chars));
                    setSavedChars(chars);
                    showToast("Personagem salvo!");
                } else {
                    let threats = getSavedThreats();
                    const index = threats.findIndex(t => t.id === savingData.id);
                    if (index >= 0) threats[index] = savingData;
                    else threats.push(savingData);
                    localStorage.setItem(THREAT_STORAGE_KEY, JSON.stringify(threats));
                    setSavedThreats(threats);
                    showToast(type === 'pnj' ? "PNJ salvo!" : "Ameaça salva!");
                }
                
                // Se a ficha salva for a atual do editor, atualiza o state
                if (!data.id || data.id === savingData.id) {
                    setData(savingData);
                }
            };

            const loadCharacter = (id) => {
                const char = savedChars.find(c => c.id === id);
                if (char) { setData(JSON.parse(JSON.stringify(char))); setView('editor'); }
            };
            
            const loadThreat = (id) => {
                const threat = savedThreats.find(t => t.id === id);
                if (threat) { setData(JSON.parse(JSON.stringify(threat))); setView('editor'); }
            };
            
            const loadTemplate = (modelo) => {
                const templateData = JSON.parse(JSON.stringify(modelo));
                templateData.id = Date.now().toString();
                setData(templateData);
                setShowThreatModal(false);
                setView('editor');
            };

            const createNewCharacter = () => {
                setData(JSON.parse(JSON.stringify({ ...initialData, id: Date.now().toString() })));
                setView('editor');
                setMobileTab('status');
            };

            const deleteCharacter = (id) => {
                const chars = savedChars.filter(c => c.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chars));
                setSavedChars(chars);
                setDeleteConfirmId(null);
                showToast("Personagem apagado.");
            };
            
            const deleteThreat = (id) => {
                const threats = savedThreats.filter(t => t.id !== id);
                localStorage.setItem(THREAT_STORAGE_KEY, JSON.stringify(threats));
                setSavedThreats(threats);
                setDeleteConfirmId(null);
                showToast("Ficha apagada.");
            };

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            const handlePrintClick = () => {
                setIsPrintMode(true);
                setTimeout(() => {
                    try {
                        window.print();
                    } catch (err) {
                        console.error('Erro ao abrir a impressão:', err);
                        showToast("Não foi possível abrir a impressão automaticamente. Use Ctrl+P (ou Cmd+P no Mac).");
                    }
                }, 300);
            };

            const updateField = (path, value) => {
                const newData = JSON.parse(JSON.stringify(data));
                let current = newData;
                const keys = path.split('.');
                const lastKey = keys.pop();
                
                keys.forEach(key => { if (!current[key]) current[key] = {}; current = current[key]; });
                current[lastKey] = value;
                setData(newData);
            };

            const updateArrayField = (arrayName, index, field, value) => {
                const newData = JSON.parse(JSON.stringify(data));
                newData[arrayName][index][field] = value;
                setData(newData);
            };

            const toggleTreinada = (arrayName, index) => {
                const newData = JSON.parse(JSON.stringify(data));
                const skill = newData[arrayName][index];
                skill.treinada = !skill.treinada;
                
                const attrKey = skill.attr.toLowerCase();
                const attrValue = newData.atributos[attrKey]?.valor || 10;
                const base = getChanceBase(attrValue);
                
                skill.valor = skill.treinada ? base * 2 : base;
                setData(newData);
            };

            const addToArray = (arrayName, emptyObj) => {
                const newData = JSON.parse(JSON.stringify(data));
                newData[arrayName].push(emptyObj);
                setData(newData);
            };
            
            const removeFromArray = (arrayName, index) => {
                const newData = JSON.parse(JSON.stringify(data));
                newData[arrayName] = newData[arrayName].filter((_, i) => i !== index);
                setData(newData);
            };
            
            const generatePnjAspect = (field) => {
                const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];
                const lists = {
                    atitude: ['Hostil e Agressivo', 'Desconfiado/Na defensiva', 'Indiferente e Distante', 'Curioso', 'Amistoso e Solícito', 'Amedrontado/Acovardado', 'Arrogante e Superior', 'Servil e Puxa-saco'],
                    motivacao: ['Proteger seu território ou bens', 'Ficar rico/Ganhar moedas', 'Cumprir ordens superiores', 'Apenas sobreviver mais um dia', 'Vingança contra alguém', 'Alcançar glória e fama', 'Busca cega por conhecimento', 'Esconder um terrível segredo'],
                    tracoMarcante: ['Cicatriz bem visível', 'Voz extremamente rouca', 'Roupas gastas e extravagantes', 'Cheiro muito forte (suor/perfume)', 'Falta de um ou mais dentes', 'Sempre sorrindo, mesmo em perigo', 'Tosse constante e seca', 'Olhar fixo e perturbador', 'Muitas tatuagens tribais', 'Mancando de uma perna'],
                    profissao: ['Guarda/Milícia', 'Mercador/Caixeiro', 'Bandido/Mercenário', 'Fazendeiro/Aldeão', 'Cultista/Fanático', 'Nobre/Aristocrata', 'Caçador/Guia', 'Artesão/Ferreiro', 'Estalajadeiro', 'Ladrão de rua'],
                    nome: ['Thorek', 'Elara', 'Bram', 'Kaelen', 'Mira', 'Rurik', 'Sila', 'Varn', 'Ylva', 'Gorbag', 'Alden', 'Lyra', 'Fendrel', 'Nyx', 'Orik']
                };
                if(lists[field]) updateField(field, getRandom(lists[field]));
            };

            const handleAttributeChange = (attr, value) => {
                const newData = JSON.parse(JSON.stringify(data));
                newData.atributos[attr].valor = value;
                
                if (!newData.status?.manterDerivados) {
                    if (attr === 'for') { newData.derivados.danoBonusFor = getDanoBonus(value); newData.derivados.limiteSobrecarga = Math.ceil(value / 2); }
                    if (attr === 'agl') { newData.derivados.danoBonusAgl = getDanoBonus(value); newData.derivados.movimento = getMovimento(newData.bio.ancestralidade, value); }
                    if (attr === 'con') { newData.status.pv.max = value; }
                    if (attr === 'von') { newData.status.pd.max = value; }
                }
                setData(newData);
            };

            const handleAncestryChange = (value) => {
                const newData = JSON.parse(JSON.stringify(data));
                newData.bio.ancestralidade = value;
                if (!newData.status?.manterDerivados) newData.derivados.movimento = getMovimento(value, newData.atributos.agl.valor);
                setData(newData);
            };

            const syncDerivados = () => {
                const newData = JSON.parse(JSON.stringify(data));
                const f = newData.atributos.for.valor || 10;
                const a = newData.atributos.agl.valor || 10;
                const c = newData.atributos.con.valor || 10;
                const v = newData.atributos.von.valor || 10;
                
                newData.derivados.danoBonusFor = getDanoBonus(f);
                newData.derivados.limiteSobrecarga = Math.ceil(f / 2);
                newData.derivados.danoBonusAgl = getDanoBonus(a);
                newData.derivados.movimento = getMovimento(newData.bio.ancestralidade, a);
                newData.status.pv.max = c;
                newData.status.pd.max = v;

                setData(newData);
                showToast("Valores Derivados, PV e PD atualizados!");
            };

            const handleExport = async (charDataOrEvent) => {
                const charToExport = (charDataOrEvent && charDataOrEvent.id) ? charDataOrEvent : data;
                try {
                    const zip = new JSZip();
                    const jsonData = JSON.stringify(charToExport, null, 2);
                    let fileName = `Ficha_${charToExport.bio?.nome || charToExport.nome || 'Novo_Personagem'}.json`;
                    if (charToExport.type === 'pnj') fileName = `PNJ_${charToExport.nome || 'Lacaio'}.json`;
                    if (charToExport.type === 'ameaca') fileName = `Ameaca_${charToExport.nome || 'Monstro'}.json`;

                    zip.file(fileName, jsonData);
                    const content = await zip.generateAsync({ type: "blob" });
                    const url = URL.createObjectURL(content);
                    
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.href = url;
                    let zipName = `Dragonbane_Ficha.zip`;
                    if (charToExport.type === 'pnj' || charToExport.type === 'ameaca') zipName = `Dragonbane_${charToExport.type === 'pnj' ? 'PNJ' : 'Ameaca'}.zip`;
                    
                    downloadAnchorNode.download = zipName;
                    document.body.appendChild(downloadAnchorNode);
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                    URL.revokeObjectURL(url);
                    
                    showToast("Ficha exportada em .ZIP! Extraia o arquivo para importar o .json.");
                } catch (error) { showToast("Erro ao exportar o arquivo ZIP."); console.error(error); }
            };

            const handleImport = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        const type = importedData.type || 'pc'; 
                        
                        let dataToLoad;
                        if (type === 'pc') dataToLoad = { ...initialData, ...importedData };
                        else if (type === 'pnj') dataToLoad = { ...initialPnjData, ...importedData };
                        else if (type === 'ameaca') dataToLoad = { ...initialAmeacaData, ...importedData };

                        if(!dataToLoad.id) dataToLoad.id = Date.now().toString();
                        
                        saveToLocal(dataToLoad);
                        setView('editor');
                    } catch (error) { showToast("Erro: Arquivo inválido. Certifique-se de extrair o .ZIP e selecionar o .json."); }
                };
                reader.readAsText(file);
                event.target.value = ''; 
            };

            const openCodeExport = (itemToExport) => {
                const clone = JSON.parse(JSON.stringify(itemToExport));
                if (clone.bio && clone.bio.imagem) clone.bio.imagem = ''; 
                if (clone.imagem) clone.imagem = '';
                
                const compressed = LZString.compressToBase64(JSON.stringify(clone));
                setCodeModal({ isOpen: true, mode: 'export', code: compressed });
            };

            const openCodeImport = () => setCodeModal({ isOpen: true, mode: 'import', code: '' });

            const handleCodeImport = () => {
                try {
                    const decompressed = LZString.decompressFromBase64(codeModal.code.trim());
                    if (!decompressed) throw new Error("Código inválido");
                    const importedData = JSON.parse(decompressed);
                    
                    if(!importedData.id) importedData.id = Date.now().toString();
                    
                    saveToLocal(importedData);
                    setView('editor');
                    setCodeModal({ isOpen: false, mode: 'import', code: '' });
                    showToast("Ficha importada com sucesso via código!");
                } catch (err) {
                    showToast("Erro: Código de ficha inválido ou corrompido.");
                }
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(codeModal.code).then(() => {
                    showToast("Código copiado para a área de transferência!");
                }).catch(() => {
                    const textArea = document.createElement("textarea");
                    textArea.value = codeModal.code;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                    showToast("Código copiado para a área de transferência!");
                });
            };

            const handleImageUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => { updateField('bio.imagem', e.target.result); };
                reader.readAsDataURL(file);
            };

            const applyImageUrl = () => {
                if (tempUrl) { updateField('bio.imagem', tempUrl); setTempUrl(''); setShowUrlInput(false); }
            };

            const condicoesNomes = { for: 'Exausto', con: 'Adoecido', agl: 'Aturdido', int: 'Enraivecido', von: 'Assustado', car: 'Desanimado' };

            if (view === 'dashboard') {
                return (
                    <React.Fragment>
                        <div className="max-w-5xl mx-auto mt-4 md:mt-10 p-4 animate-fade-in-up">
                            {/* Seção Personagens */}
                            <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 no-print">
                                <h1 className="text-3xl font-title font-bold text-dragon-dark border-b-4 border-red-800 pb-2">Meus Personagens</h1>
                                <div className="flex flex-wrap gap-2 w-full md:w-auto justify-center items-center">
                                    <div className="flex items-center gap-1 bg-gray-200 border border-gray-300 rounded px-2 py-1.5 shadow-sm">
                                        <SVGIcons.Palette />
                                        <select 
                                            value={theme} 
                                            onChange={(e) => { if (e.target.value === 'custom') setShowCustomBgModal(true); else setTheme(e.target.value); }} 
                                            className="bg-transparent text-gray-700 font-bold text-xs outline-none cursor-pointer"
                                        >
                                            <option value="default">Tema: Padrão</option>
                                            <option value="classic">Tema: Clássico Dragonbane</option>
                                            <option value="custom">Tema: Personalizado...</option>
                                        </select>
                                    </div>
                                    <button onClick={() => setShowGuideModal(true)} className="flex items-center gap-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded shadow transition-colors font-bold text-sm">
                                        <SVGIcons.HelpCircle /> Guias & Tutoriais
                                    </button>
                                    <button onClick={openCodeImport} className="flex justify-center items-center gap-1 bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded shadow transition-colors font-bold text-sm" title="Colar código em texto da ficha">
                                        <SVGIcons.Code /> Colar Código
                                    </button>
                                    <label className="cursor-pointer flex justify-center items-center gap-1 bg-gray-700 hover:bg-gray-800 text-white px-3 py-2 rounded shadow transition-colors font-bold text-sm">
                                        <SVGIcons.Upload /> ZIP/JSON
                                        <input type="file" accept=".json" className="hidden" onChange={handleImport} />
                                    </label>
                                    <button onClick={() => { setCreateTarget('pc'); setShowSystemModal(true); }} className="flex justify-center items-center gap-1 bg-red-800 hover:bg-red-700 text-white px-4 py-2 rounded shadow transition-colors font-bold text-sm">
                                        <SVGIcons.Plus /> Novo Personagem
                                    </button>
                                </div>
                            </div>

                            {/* Personagens Grid */}
                            {savedChars.length === 0 ? (
                                <div style={getWindowStyle()} className="text-center py-20 bg-white rounded-lg shadow border-2 border-dashed border-gray-300">
                                    <div className="flex justify-center text-gray-400"><SVGIcons.User /></div>
                                    <p className="text-gray-500 mt-4 text-lg">Nenhum personagem encontrado na sua pasta.</p>
                                    <p className="text-gray-400 text-sm">Crie um novo, cole um Código ou importe um arquivo .ZIP</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {savedChars.map(char => (
                                        <div key={char.id} style={getWindowStyle()} className="bg-white rounded-md shadow-lg border-2 border-dragon-dark overflow-hidden flex flex-col">
                                            <div className="flex h-28 border-b border-gray-300 cursor-pointer hover:bg-gray-50 transition-colors" onClick={() => loadCharacter(char.id)}>
                                                <div className="w-28 shrink-0 bg-gray-200 border-r border-gray-300">
                                                    {char.bio?.imagem ? (
                                                        <img src={char.bio.imagem} alt={char.bio.nome} className="w-full h-full object-cover" />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center text-gray-400 bg-gray-100"><SVGIcons.User /></div>
                                                    )}
                                                </div>
                                                <div className="p-3 flex-1 overflow-hidden flex flex-col justify-center">
                                                    <h3 className="font-title font-bold text-lg truncate text-red-900">{char.bio?.nome || 'Sem Nome'}</h3>
                                                    <p className="text-xs text-gray-600 font-bold uppercase mt-1 truncate">{char.bio?.ancestralidade || '?'} • {char.bio?.profissao || '?'}</p>
                                                    <p className="text-[10px] text-gray-500 mt-2 truncate italic">Jogador: {char.bio?.jogador || '-'}</p>
                                                </div>
                                            </div>
                                            <div className="bg-gray-100 p-2 flex justify-between items-center text-xs">
                                                <div className="flex gap-1">

                                                <label className="block text-xs font-bold text-gray-500 uppercase">Dano Bônus</label>
                                                <input type="text" value={data.danoBonus} onChange={e => updateField('danoBonus', e.target.value)} className="w-full border-b border-gray-400 outline-none bg-transparent font-bold" placeholder="Ex: +D4" />
                                            </div>
                                            <div className="flex gap-2 items-end">
                                                <div className="flex-1">
                                                    <label className="block text-[10px] font-bold text-gray-500 uppercase">Armadura</label>
                                                    <input type="text" value={data.armaduraTipica?.nome} onChange={e => updateField('armaduraTipica.nome', e.target.value)} className="w-full bg-transparent outline-none text-sm font-bold border-b border-gray-300" placeholder="Tipo..." />
                                                </div>
                                                <div className="w-12">
                                                    <label className="block text-[10px] font-bold text-gray-500 uppercase text-center">Val.</label>
                                                    <input type="text" value={data.armaduraTipica?.valor} onChange={e => updateField('armaduraTipica.valor', e.target.value)} className="w-full bg-transparent outline-none text-sm text-center font-bold border-b border-gray-300" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div className="border-2 border-red-800 rounded bg-red-50 p-3 flex flex-col items-center justify-center text-center shadow-sm">
                                            <div className="font-title font-bold text-red-900 text-xs uppercase">PONTOS DE VIDA</div>
                                            <div className="flex items-center justify-center gap-1 mt-2">
                                                <input type="number" value={data.status?.pv.atual} onChange={e => updateField('status.pv.atual', parseInt(e.target.value)||0)} className="w-12 text-center text-2xl font-bold border-b-2 border-red-300 bg-transparent outline-none" />
                                                <span className="text-xl">/</span>
                                                <input type="number" value={data.status?.pv.max} onChange={e => updateField('status.pv.max', parseInt(e.target.value)||0)} className="w-12 text-center text-2xl font-bold border-b-2 border-red-300 bg-transparent outline-none" />
                                            </div>
                                        </div>
                                        <div className={`border-2 rounded p-3 flex flex-col items-center justify-center text-center shadow-sm transition-opacity ${data.tipoPnj === 'lacaio' ? 'border-gray-300 bg-gray-100 opacity-50' : 'border-blue-800 bg-blue-50'}`}>
                                            <div className={`font-title font-bold text-xs uppercase ${data.tipoPnj === 'lacaio' ? 'text-gray-500' : 'text-blue-900'}`}>PONTOS DE DET.</div>
                                            <div className="flex items-center justify-center gap-1 mt-2">
                                                <input type="number" disabled={data.tipoPnj === 'lacaio'} value={data.status?.pd.atual} onChange={e => updateField('status.pd.atual', parseInt(e.target.value)||0)} className="w-12 text-center text-2xl font-bold border-b-2 border-blue-300 bg-transparent outline-none disabled:border-transparent" />
                                                <span className="text-xl">/</span>
                                                <input type="number" disabled={data.tipoPnj === 'lacaio'} value={data.status?.pd.max} onChange={e => updateField('status.pd.max', parseInt(e.target.value)||0)} className="w-12 text-center text-2xl font-bold border-b-2 border-blue-300 bg-transparent outline-none disabled:border-transparent" />
                                            </div>
                                            {data.tipoPnj === 'lacaio' && <span className="text-[9px] mt-1 text-gray-500">Lacaios raramente usam PD</span>}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center bg-gray-200 py-1 px-3 mb-2 rounded-sm border border-gray-300 sub-header-print">
                                            <h3 className="font-title font-bold text-sm text-gray-700">PERÍCIAS PRINCIPAIS</h3>
                                            <button onClick={() => addToArray('pericias', { nome: '', valor: '' })} className="text-[10px] bg-gray-500 hover:bg-gray-600 text-white px-2 py-1 rounded no-print flex items-center gap-1 shadow-sm hide-in-print-mode"><SVGIcons.Plus/> Adic.</button>
                                        </div>
                                        <div className="space-y-1">
                                            {data.pericias?.length === 0 && <p className="text-[10px] text-gray-400 italic">Nenhuma perícia adicionada.</p>}
                                            {(data.pericias || []).map((pericia, index) => (
                                                <div key={index} className="flex items-center gap-2 p-1 rounded hover:bg-gray-100">
                                                    <input type="text" value={pericia.nome} placeholder="Perícia..." onChange={e => updateArrayField('pericias', index, 'nome', e.target.value)} className="flex-1 border-b border-gray-400 outline-none bg-transparent text-sm font-bold min-w-0" />
                                                    <input type="number" value={pericia.valor} onChange={e => updateArrayField('pericias', index, 'valor', e.target.value)} className="w-12 text-center border-b border-gray-400 outline-none bg-transparent font-bold" />
                                                    <button onClick={() => removeFromArray('pericias', index)} className="text-red-500 hover:text-red-700 no-print"><SVGIcons.Trash/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Coluna Direita PNJ */}
                                <div className="print-break md:col-span-7 space-y-6">
                                    <div className="mb-6">
                                        <div className="flex justify-between items-center bg-gray-200 py-1 px-3 mb-2 rounded-sm border border-gray-300 sub-header-print">
                                            <h3 className="font-title font-bold text-sm text-gray-700">ARMAS E ATAQUES</h3>
                                            <button onClick={() => addToArray('armas', { nome: '', pericia: '', dano: '' })} className="text-[10px] bg-gray-500 text-white px-2 py-1 rounded no-print flex items-center gap-1 shadow-sm font-bold hide-in-print-mode"><SVGIcons.Plus/> Adic.</button>
                                        </div>
                                        <div className="space-y-3">
                                            {data.armas?.length === 0 && <p className="text-[10px] text-gray-400 italic">Nenhuma arma adicionada.</p>}
                                            {(data.armas || []).map((arma, index) => (
                                                <div key={index} className="border border-gray-300 p-2 rounded bg-gray-50 shadow-sm flex flex-col gap-2">
                                                    <div className="flex gap-2 items-end">
                                                        <div className="flex-1">
                                                            <label className="block text-[9px] font-bold text-gray-500 uppercase">Arma</label>
                                                            <input type="text" value={arma.nome} onChange={e => updateArrayField('armas', index, 'nome', e.target.value)} className="w-full border-b border-gray-400 outline-none text-sm font-bold bg-transparent"/>
                                                        </div>
                                                        <div className="w-16">
                                                            <label className="block text-[9px] font-bold text-gray-500 uppercase text-center">Nív. Per.</label>
                                                            <input type="number" value={arma.pericia} onChange={e => updateArrayField('armas', index, 'pericia', e.target.value)} className="w-full border-b border-gray-400 outline-none text-sm font-bold bg-transparent text-center"/>
                                                        </div>
                                                        <div className="w-24">
                                                            <label className="block text-[9px] font-bold text-gray-500 uppercase text-center">Dano</label>
                                                            <input type="text" value={arma.dano} placeholder="Ex: 2d6+d4" onChange={e => updateArrayField('armas', index, 'dano', e.target.value)} className="w-full border-b border-gray-400 outline-none text-sm font-bold bg-transparent text-center text-red-800"/>
                                                        </div>
                                                        <button onClick={() => removeFromArray('armas', index)} className="text-red-500 hover:text-red-700 no-print mb-1 ml-2"><SVGIcons.Trash/></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center bg-gray-200 py-1 px-3 mb-2 rounded-sm border border-gray-300 sub-header-print">
                                            <h3 className="font-title font-bold text-sm text-gray-700">HABILIDADES E FEITIÇOS</h3>
                                            <button onClick={() => addToArray('feiticos', { nome: '', desc: '' })} className="text-[10px] bg-gray-500 text-white px-2 py-1 rounded no-print flex items-center gap-1 shadow-sm font-bold hide-in-print-mode"><SVGIcons.Plus/> Adic.</button>
                                        </div>
                                        <div className="space-y-2">
                                            {data.feiticos?.length === 0 && <p className="text-[10px] text-gray-400 italic">Nenhuma habilidade listada.</p>}
                                            {(data.feiticos || []).map((hab, index) => (
                                                <div key={index} className="flex gap-2 items-start p-2 border border-gray-200 rounded bg-gray-50">
                                                    <div className="flex-1 space-y-1">
                                                        <input type="text" value={hab.nome} onChange={e => updateArrayField('feiticos', index, 'nome', e.target.value)} className="w-full border-b border-gray-300 bg-transparent font-bold text-sm outline-none" placeholder="Nome do Feitiço/Habilidade..." />
                                                        <textarea rows="2" value={hab.desc} onChange={e => updateArrayField('feiticos', index, 'desc', e.target.value)} className="w-full bg-transparent outline-none text-xs resize-y" placeholder="Descrição do efeito..."></textarea>
                                                    </div>
                                                    <button onClick={() => removeFromArray('feiticos', index)} className="text-red-500 hover:text-red-700 no-print mt-1"><SVGIcons.Trash/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase mb-1 mt-2">Equipamento & Tesouro</label>
                                        <textarea rows="4" value={data.equipamento} onChange={e => updateField('equipamento', e.target.value)} className="w-full border-2 border-gray-300 rounded p-2 text-sm outline-none bg-gray-50 resize-y mb-3"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {data.type === 'ameaca' && (
                        <div id="ficha-print-area" className="p-4 md:p-8 space-y-6 bg-white" style={theme === 'custom' ? { background: 'transparent' } : {}}>
                            {/* Header Monstro */}
                            <div className="print-break flex flex-col md:flex-row gap-6 pb-4 border-b-4 border-red-900 items-end">
                                <div className="flex-1 w-full">
                                    <label className="block text-xs font-bold text-red-900 uppercase tracking-widest mb-1">Nome da Ameaça / Monstro</label>
                                    <input type="text" value={data.nome} onChange={e => updateField('nome', e.target.value)} className="w-full text-3xl font-title font-bold border-b-2 border-gray-400 focus:border-red-600 outline-none bg-transparent" placeholder="Ex: Troll Antigo, Demônio..." />
                                </div>
                                <div className="w-full md:w-48 text-center bg-red-50 border-2 border-red-900 rounded p-2 shadow-sm">
                                    <label className="block text-xs font-bold text-red-900 uppercase mb-1" title="Número de ações/cartas de iniciativa por rodada">Ferocidade (Ações)</label>
                                    <input type="number" value={data.ferocidade} onChange={e => updateField('ferocidade', parseInt(e.target.value)||1)} className="w-full text-center text-3xl font-black bg-transparent outline-none text-red-900" />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-12 gap-8 pt-2 print-landscape-grid">
                                {/* Coluna Esquerda Monstro */}
                                <div className="print-break md:col-span-4 space-y-6">
                                    <div className="border border-gray-300 p-4 bg-gray-50 rounded shadow-sm space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-500 uppercase mb-1">Tamanho</label>
                                            <select value={data.tamanho} onChange={e => updateField('tamanho', e.target.value)} className="w-full p-2 border border-gray-300 rounded text-sm font-bold text-gray-800 bg-white outline-none cursor-pointer">
                                                <option value="Pequeno">Pequeno</option>
                                                <option value="Normal">Normal</option>
                                                <option value="Grande">Grande</option>
                                                <option value="Enorme">Enorme</option>
                                                <option value="Enxame">Enxame</option>
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-500 uppercase">Movimento</label>
                                                <input type="text" value={data.movimento} onChange={e => updateField('movimento', e.target.value)} className="w-full border-b border-gray-400 outline-none bg-transparent font-bold text-center text-lg" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-500 uppercase">Armadura</label>
                                                <input type="text" value={data.armadura} onChange={e => updateField('armadura', e.target.value)} className="w-full border-b border-gray-400 outline-none bg-transparent font-bold text-center text-lg" placeholder="Ex: 4" />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="border-2 border-red-900 rounded bg-red-50 p-4 flex flex-col items-center justify-center text-center shadow">
                                        <div className="font-title font-black text-red-900 text-sm uppercase tracking-widest">PONTOS DE VIDA (MONSTRO)</div>
                                        <div className="flex items-center justify-center gap-1 mt-3">
                                            <input type="number" value={data.status?.pv.atual} onChange={e => updateField('status.pv.atual', parseInt(e.target.value)||0)} className="w-16 text-center text-4xl font-black border-b-2 border-red-300 bg-transparent outline-none text-red-900" />
                                            <span className="text-2xl text-red-900 font-black">/</span>
                                            <input type="number" value={data.status?.pv.max} onChange={e => updateField('status.pv.max', parseInt(e.target.value)||0)} className="w-16 text-center text-4xl font-black border-b-2 border-red-300 bg-transparent outline-none text-red-900" />
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center bg-gray-200 py-1 px-3 mb-2 rounded-sm border border-gray-300 sub-header-print">
                                            <h3 className="font-title font-bold text-sm text-gray-700">HABILIDADES ESPECIAIS</h3>
                                            <button onClick={() => addToArray('habilidades', { nome: '', desc: '' })} className="text-[10px] bg-red-900 text-white px-2 py-1 rounded no-print flex items-center gap-1 shadow-sm font-bold hide-in-print-mode"><SVGIcons.Plus/> Adic.</button>
                                        </div>
                                        <div className="space-y-3">
                                            {data.habilidades?.length === 0 && <p className="text-[10px] text-gray-400 italic">Nenhuma habilidade (ex: Imunidades, Magia).</p>}
                                            {(data.habilidades || []).map((hab, index) => (
                                                <div key={index} className="flex gap-2 items-start p-2 border border-red-200 rounded bg-red-50/50">
                                                    <div className="flex-1 space-y-1">
                                                        <input type="text" value={hab.nome} onChange={e => updateArrayField('habilidades', index, 'nome', e.target.value)} className="w-full border-b border-red-300 bg-transparent font-bold text-sm outline-none text-red-900" placeholder="Ex: Imunidade a Fogo..." />
                                                        <textarea rows="3" value={hab.desc} onChange={e => updateArrayField('habilidades', index, 'desc', e.target.value)} className="w-full bg-transparent outline-none text-xs resize-y" placeholder="Detalhes..."></textarea>
                                                    </div>
                                                    <button onClick={() => removeFromArray('habilidades', index)} className="text-red-500 hover:text-red-700 no-print mt-1"><SVGIcons.Trash/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Coluna Direita Monstro - Tabela Fixa 1 a 6 */}
                                <div className="print-break md:col-span-8">
                                    <div className="bg-red-900 text-white py-2 px-4 rounded-t-sm shadow-sm flex items-center gap-2 header-print">
                                        <SVGIcons.Dice />
                                        <h2 className="font-title font-bold text-lg tracking-widest uppercase">ATAQUES DO MONSTRO (Role D6)</h2>
                                    </div>
                                    <div className="border-x border-b border-red-900 bg-white rounded-b-sm shadow-sm overflow-hidden">
                                        {[1, 2, 3, 4, 5, 6].map((num, idx) => {
                                            const ataque = (data.ataques && data.ataques[idx]) || { id: num, descricao: '' };
                                            return (
                                                <div key={num} className={`flex border-b border-gray-200 last:border-0 ${num % 2 === 0 ? 'bg-gray-50' : 'bg-white'}`}>
                                                    <div className="w-12 md:w-16 flex items-center justify-center font-black text-2xl text-red-900 border-r border-gray-200 bg-red-50/30">
                                                        {num}
                                                    </div>
                                                    <div className="flex-1 p-2">
                                                        <textarea 
                                                            rows="3" 
                                                            value={ataque.descricao} 
                                                            onChange={e => {
                                                                const newAtaques = [...(data.ataques || Array(6).fill({descricao:''}))];
                                                                newAtaques[idx] = { ...newAtaques[idx], descricao: e.target.value, id: num };
                                                                updateField('ataques', newAtaques);
                                                            }} 
                                                            className="w-full bg-transparent outline-none text-sm resize-y leading-relaxed" 
                                                            placeholder={`Descrição do ataque ${num} (Nome, alvo, dano, efeitos especiais como derrubar, veneno, etc)...`}
                                                        ></textarea>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="mt-4 p-4 border border-blue-200 bg-blue-50 text-blue-900 text-xs rounded hide-in-print-mode">
                                        <b className="flex items-center gap-1 mb-1"><SVGIcons.HelpCircle /> Como funciona a Tabela de Ataque?</b>
                                        Em Dragonbane, Monstros não fazem testes de perícia normais para atacar. No turno do Monstro, você rola um D6 e consulta esta tabela para ver qual ataque ele usará automaticamente. Esses ataques não costumam poder ser aparados (apenas esquivados).
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true };
            }

            componentDidCatch(error, errorInfo) {
                console.error("Erro capturado pelo ErrorBoundary:", error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                            <div className="bg-white p-8 rounded-lg shadow-xl max-w-md border-2 border-red-800 animate-fade-in-up">
                                <h2 className="text-2xl font-bold text-red-700 mb-4 font-title">Ops! Algo deu errado.</h2>
                                <p className="text-gray-600 mb-6 text-sm">
                                    Ocorreu um erro inesperado na renderização. Isso pode acontecer devido a bloqueios de segurança do navegador (sandboxing) em áreas de preview ou falha de leitura dos dados.
                                </p>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="bg-red-800 hover:bg-red-700 text-white font-bold py-2 px-6 rounded shadow-lg transition-colors"
                                >
                                    Recarregar Página
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
